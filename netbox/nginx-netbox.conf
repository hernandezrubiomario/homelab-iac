# Destino: /etc/nginx/conf.d/netbox.conf (en el nodo netbox)
#
# Nginx aquí NO termina TLS ni actúa como frontend público: esa función
# la cumple HAProxy + Keepalived (VIP web). Nginx solo sirve los
# estáticos de NetBox y hace de proxy local hacia Gunicorn.

server {
    # Nginx escucha solo en la IP interna de NetBox y puerto 8080.
    listen 192.168.10.50:8080;

    # Nombre DNS de la aplicación.
    server_name netbox.lab.local;

    # Tamaño máximo permitido para peticiones/subidas.
    client_max_body_size 25m;

    # Archivos estáticos de NetBox: CSS, JavaScript, imágenes, etc.
    location /static/ {
        alias /opt/netbox/netbox/static/;
    }

    # El resto de peticiones se envían a Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8001;
        # Conserva información de la petición original.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Nota: si Nginx puede servir /static/ pero las peticiones a Gunicorn
# fallan, comprueba SELinux:
#   getenforce
#   setsebool -P httpd_can_network_connect 1
