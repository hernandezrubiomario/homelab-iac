; El documento original solo indica "touch ansible.cfg" sin contenido
; final. Estos son los valores mínimos razonables para la estructura
; de este proyecto: ajústalos si tu ansible.cfg real difiere.

[defaults]
; Inventario estático por defecto. El inventario dinámico de NetBox
; (inventories/lab/netbox.yml) se añade explícitamente con -i cuando
; se necesita (ver deploy_vm.sh).
inventory      = inventories/lab/hosts.yml
roles_path     = roles
retry_files_enabled = False
host_key_checking   = True

[privilege_escalation]
become        = True
become_method = sudo
