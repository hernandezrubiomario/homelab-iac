all:
  children:
    # Nodo de control de Ansible
    control:
      hosts:
        automation:
          # Ansible se ejecuta localmente en este nodo
          ansible_connection: local

    # Servidor de identidad, DNS y Kerberos
    identity:
      hosts:
        ipa:
          ansible_host: ipa.lab.local

    # Servidor de monitorización: Prometheus y Grafana
    monitoring_server:
      hosts:
        monitoring:
          ansible_host: monitoring.lab.local

    # Servidor NetBox (inventario e IPAM)
    netbox_server:
      hosts:
        netbox:
          # Backend real de NetBox, no la VIP web
          ansible_host: netbox-backend.lab.local

    # Balanceadores HAProxy
    haproxies:
      hosts:
        HAProxy-1:
          ansible_host: haproxy-1.lab.local
        HAProxy-2:
          ansible_host: haproxy-2.lab.local

    # Clúster Hadoop
    hadoop:
      hosts:
        hadoop-master:
          ansible_host: hadoop-master.lab.local
        hadoop-worker1:
          ansible_host: hadoop-worker1.lab.local
        hadoop-worker2:
          ansible_host: hadoop-worker2.lab.local
        hadoop-worker3:
          ansible_host: hadoop-worker3.lab.local

    # Clúster PostgreSQL HA gestionado por Patroni
    postgresql:
      hosts:
        postgresql1:
          ansible_host: postgresql1.lab.local
        postgresql2:
          ansible_host: postgresql2.lab.local
        postgresql3:
          ansible_host: postgresql3.lab.local

# No se incluyen IPs porque todos los nombres resuelven correctamente
# mediante FreeIPA-DNS.
#
# Las VMs creadas por Terraform NO se añaden aquí: se descubren
# automáticamente mediante el inventario dinámico de NetBox
# (inventories/lab/netbox.yml).
